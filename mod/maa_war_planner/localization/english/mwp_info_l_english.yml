l_english:
 mwp_info_open_label: "Info: war plans"
 mwp_info_open_tooltip: "Show possible opponents, current wars, fort levels and the current MAA recommendation. This opens information only."
 mwp_info_title: "Strategist Assistant — military plans"
 mwp_info_decision: "Review military plans"
 mwp_info_decision_desc: "Review possible offensive and defensive opponents, current wars and the recommended men-at-arms type."
 mwp_info_coverage: "Potential opponents, not final war declarations. Target conditions and allied participation are not predicted."
 mwp_info_future_tooltip: "A row identifies a possible opponent, not every combination of casus belli, claimant and target title. The available label uses the game’s declaration interaction check. It does not verify the final selected target, cost or send options. Factions, future scripted invasions and predicted allied participation are not included."
 mwp_info_offensive_heading: "Showing [GetDataModelSize(GetPlayer.MakeScope.GetList(Select_CString(GetVariableSystem.Exists('mwp_info_show_candidates'),'mwp_info_offensive_sorted','mwp_info_offensive_valid_sorted')))] · strongest first"
 mwp_info_defensive_heading: "Showing [GetDataModelSize(GetPlayer.MakeScope.GetList(Select_CString(GetVariableSystem.Exists('mwp_info_show_candidates'),'mwp_info_defensive_sorted','mwp_info_defensive_valid_sorted')))] · strongest first"
 mwp_info_active_heading: "Wars: [GetDataModelSize(GetPlayer.MakeScope.GetList('mwp_info_active_wars'))]"
 mwp_info_offensive_available: "#P Declaration action available#!"
 mwp_info_offensive_candidate: "#warning Casus belli found · declaration action unavailable#!"
 mwp_info_defensive_available: "#N Opponent can use the declaration action#!"
 mwp_info_defensive_candidate: "#warning Opponent has a casus belli · declaration action unavailable#!"
 mwp_info_strength: "Current troops: [Character.GetCurrentMilitaryStrength|0]"
 mwp_info_strength_tooltip: "The ruler’s current military strength. Future recruits, commanders, terrain and possible allied participation are not predicted."
 mwp_info_capital_fort: "Capital fort level: [Character.GetCapitalLocation.GetFortLevel|0]"
 mwp_info_no_capital: "—"
 mwp_info_active_cb: "Reason: [War.GetActiveCB.GetType.GetName]"
 mwp_info_fort_summary: "Enemy realms: [GetPlayer.MakeScope.GetVariable('mwp_war_fort_sample_count').GetValueWithDefault('(CFixedPoint)0')|0] forts · highest level [GetPlayer.MakeScope.GetVariable('mwp_war_fort_peak').GetValueWithDefault('(CFixedPoint)0')|0]"
 mwp_info_forts_tooltip: "All distinct passable provinces in relevant enemy realms contribute terrain ([GetPlayer.MakeScope.GetVariable('mwp_war_terrain_sample_count').GetValueWithDefault('(CFixedPoint)0')|0] provinces); all their forts contribute siege requirements. Capitals ([GetPlayer.MakeScope.GetVariable('mwp_war_region_capital_count').GetValueWithDefault('(CFixedPoint)0')|0]) and border provinces ([GetPlayer.MakeScope.GetVariable('mwp_war_region_border_count').GetValueWithDefault('(CFixedPoint)0')|0]) are marked subsets, counted once even when realms overlap. War relevance supplies weights16/4/1. Garrison detail uses at most eight representatives. A row shows only that ruler’s current capital fort. Geography is a planning estimate; it does not predict the precise war objective or seasonal weather."
 mwp_info_recommendation: "#high Recommended:#! [MenAtArmsType.GetName]"
 mwp_info_no_recommendation: "$mwp_analysis_status_pending$"
 mwp_info_pending: "Refreshing the opponent analysis…"
 mwp_info_empty: "No opponents match this view. Try including unavailable casus belli or refresh the analysis."
 mwp_info_refresh_label: "Refresh analysis"
 mwp_info_refresh_tooltip: "Restart the analysis for your current character. A scan already in progress starts over. Monthly updates and enabling automatic recruitment preserve its progress."
 mwp_info_strength_value: "[Character.GetCurrentMilitaryStrength|0]"
 mwp_info_fort_value: "[Character.GetCapitalLocation.GetFortLevel|0]"
 mwp_info_filter: "Include unavailable casus belli"
 mwp_info_filter_tooltip: "The default list shows opponents whose declaration interaction passes the native availability check. Include other opponents with a known casus belli for a broader view."
 mwp_info_column_opponent: "OPPONENT / AVAILABILITY"
 mwp_info_column_war: "WAR / PRIMARY OPPONENT"
 mwp_info_column_army: "CURRENT TROOPS"
 mwp_info_column_fort: "CAPITAL FORT"
 mwp_info_tab_offensive: "Offence ([GetDataModelSize(GetPlayer.MakeScope.GetList(Select_CString(GetVariableSystem.Exists('mwp_info_show_candidates'),'mwp_info_offensive_sorted','mwp_info_offensive_valid_sorted')))])"
 mwp_info_tab_defensive: "Defence ([GetDataModelSize(GetPlayer.MakeScope.GetList(Select_CString(GetVariableSystem.Exists('mwp_info_show_candidates'),'mwp_info_defensive_sorted','mwp_info_defensive_valid_sorted')))])"
 mwp_info_tab_active: "Current wars ([GetDataModelSize(GetPlayer.MakeScope.GetList('mwp_info_active_wars'))])"
 mwp_info_active_empty: "You have no active wars."
