 mwp_dev10_reorganization_label: "Allow regiment reorganization"
 mwp_dev10_reorganization_tooltip: "Dismiss only an unraised ordinary personal regiment with a red rating when all slots are occupied and no yellow or green regiment can expand. First check that a better green replacement can be bought. No refund or level transfer; ordinary auto recruitment then starts a new regiment at one level and expands it within the budget.\n\nReorganization preserves the last useful paid personal siege regiment while enemy forts remain relevant, unless its paid replacement is another useful siege type. All normal red-only, availability and budget rules still apply."
 mwp_dev10_priority_tooltip: "Suitability priority among assessed types. 1 is the most useful. Recruitment availability, purchase resources and monthly limits are checked separately."
 mwp_dev10_likelihood_label: "Likelihood"
 mwp_dev10_likelihood_high: "High"
 mwp_dev10_likelihood_medium: "Medium"
 mwp_dev10_likelihood_low: "Low"
 mwp_dev10_likelihood_tooltip: "Relative scenario classification, not a calibrated probability. Current wars are listed separately."
 mwp_dev10_next_purchase: "Next purchase: [MenAtArmsType.GetName] · priority [GetPlayer.MakeScope.GetVariable(Concatenate('mwp_priority_',IntToString(FixedPointToInt(GetPlayer.MakeScope.GetVariable('mwp_next_catalog_id').GetValue)))).GetValue|0]"
 mwp_dev10_no_purchase: "No purchase currently available"
