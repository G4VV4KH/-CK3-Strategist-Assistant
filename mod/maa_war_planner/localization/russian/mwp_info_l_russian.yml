l_russian:
 mwp_info_open_label: "Info: войны"
 mwp_info_open_tooltip: "Показать возможных противников, текущие войны, укрепления и рекомендацию профессиональных полков. Открывает только сведения."
 mwp_info_title: "Strategist Assistant — военные планы"
 mwp_info_decision: "Посмотреть военные планы"
 mwp_info_decision_desc: "Посмотреть возможных противников для наступления и обороны, текущие войны и рекомендуемый тип профессионального полка."
 mwp_info_coverage: "Здесь возможные противники, а не готовые объявления войны. Условия конкретной цели и участие союзников не прогнозируются."
 mwp_info_future_tooltip: "Строка показывает возможного противника, а не все сочетания повода, претендента и целевого титула. Отметка доступности использует проверку игрового действия объявления войны. Окончательная цель, стоимость и дополнительные условия отправки не проверяются. Фракции, будущие сценарные вторжения и возможное участие союзников не учтены."
 mwp_info_offensive_heading: "Показано: [GetDataModelSize(GetPlayer.MakeScope.GetList(Select_CString(GetVariableSystem.Exists('mwp_info_show_candidates'),'mwp_info_offensive_sorted','mwp_info_offensive_valid_sorted')))] · по убыванию силы"
 mwp_info_defensive_heading: "Показано: [GetDataModelSize(GetPlayer.MakeScope.GetList(Select_CString(GetVariableSystem.Exists('mwp_info_show_candidates'),'mwp_info_defensive_sorted','mwp_info_defensive_valid_sorted')))] · по убыванию силы"
 mwp_info_active_heading: "Войн: [GetDataModelSize(GetPlayer.MakeScope.GetList('mwp_info_active_wars'))]"
 mwp_info_offensive_available: "#P Действие объявления войны доступно#!"
 mwp_info_offensive_candidate: "#warning Есть повод · действие объявления войны недоступно#!"
 mwp_info_defensive_available: "#N Противнику доступно действие объявления войны#!"
 mwp_info_defensive_candidate: "#warning У противника есть повод · действие недоступно#!"
 mwp_info_strength: "Текущая армия: [Character.GetCurrentMilitaryStrength|0]"
 mwp_info_strength_tooltip: "Текущая военная сила правителя. Будущий найм, командиры, местность и возможное участие союзников не прогнозируются."
 mwp_info_capital_fort: "Укрепление столицы: [Character.GetCapitalLocation.GetFortLevel|0]"
 mwp_info_no_capital: "—"
 mwp_info_active_cb: "Повод: [War.GetActiveCB.GetType.GetName]"
 mwp_info_fort_summary: "Державы противников: [GetPlayer.MakeScope.GetVariable('mwp_war_fort_sample_count').GetValueWithDefault('(CFixedPoint)0')|0] укреплений · макс. уровень [GetPlayer.MakeScope.GetVariable('mwp_war_fort_peak').GetValueWithDefault('(CFixedPoint)0')|0]"
 mwp_info_forts_tooltip: "Местность учитывается во всех различных проходимых провинциях соответствующих держав ([GetPlayer.MakeScope.GetVariable('mwp_war_terrain_sample_count').GetValueWithDefault('(CFixedPoint)0')|0] провинций), а их укрепления — в осадном расчёте. Столичные ([GetPlayer.MakeScope.GetVariable('mwp_war_region_capital_count').GetValueWithDefault('(CFixedPoint)0')|0]) и пограничные ([GetPlayer.MakeScope.GetVariable('mwp_war_region_border_count').GetValueWithDefault('(CFixedPoint)0')|0]) провинции входят в общую выборку без повторного учёта при пересечении держав. Важность войн задаёт веса 16/4/1. Гарнизоны уточняются максимум на восьми представителях. Строка правителя показывает только текущий уровень его столицы. География помогает планированию, но не предсказывает точную цель войны или сезонную погоду."
 mwp_info_recommendation: "#high Рекомендуется:#! [MenAtArmsType.GetName]"
 mwp_info_no_recommendation: "$mwp_analysis_status_pending$"
 mwp_info_pending: "Обновляется анализ противников…"
 mwp_info_empty: "В этом списке нет противников. Можно включить недоступные поводы или обновить анализ."
 mwp_info_refresh_label: "Обновить анализ"
 mwp_info_refresh_tooltip: "Запустить анализ заново для текущего персонажа. Незавершённый расчёт начнётся с начала. Ежемесячное обновление и включение авторекрутинга сохраняют его прогресс."
 mwp_info_strength_value: "[Character.GetCurrentMilitaryStrength|0]"
 mwp_info_fort_value: "[Character.GetCapitalLocation.GetFortLevel|0]"
 mwp_info_filter: "Включать недоступные поводы"
 mwp_info_filter_tooltip: "По умолчанию показаны противники, для которых доступность действия объявления войны подтверждена игрой. Включите остальные найденные поводы для более широкого обзора."
 mwp_info_column_opponent: "ПРОТИВНИК / ДОСТУПНОСТЬ"
 mwp_info_column_war: "ВОЙНА / ОСНОВНОЙ ПРОТИВНИК"
 mwp_info_column_army: "ВОЙСКО СЕЙЧАС"
 mwp_info_column_fort: "СТОЛИЦА"
 mwp_info_tab_offensive: "Наступление ([GetDataModelSize(GetPlayer.MakeScope.GetList(Select_CString(GetVariableSystem.Exists('mwp_info_show_candidates'),'mwp_info_offensive_sorted','mwp_info_offensive_valid_sorted')))])"
 mwp_info_tab_defensive: "Оборона ([GetDataModelSize(GetPlayer.MakeScope.GetList(Select_CString(GetVariableSystem.Exists('mwp_info_show_candidates'),'mwp_info_defensive_sorted','mwp_info_defensive_valid_sorted')))])"
 mwp_info_tab_active: "Текущие войны ([GetDataModelSize(GetPlayer.MakeScope.GetList('mwp_info_active_wars'))])"
 mwp_info_active_empty: "Сейчас вы не участвуете в войнах."
