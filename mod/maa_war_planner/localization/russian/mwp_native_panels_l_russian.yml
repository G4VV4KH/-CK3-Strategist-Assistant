: [GetPlayer.MakeScope.GetVariable('mwp_siege_access').GetValue|2] · осада после пополнения: [GetPlayer.MakeScope.GetVariable('mwp_siege_average_days').GetValue|0] модельных дней. Осадная полезность180/(180+дни) насыщается по мере роста оплаченной осадной вместимости.\n\n$mwp_tooltip_model_note$\n$mwp_score_basis_tooltip$\n\nДо учёта избыточности роли: [GetPlayer.MakeScope.GetVariable('mwp_raw_assessed_score_5').GetValue|5] · множитель: [GetPlayer.MakeScope.GetVariable('mwp_redundancy_factor_5').GetValue|5] · итог: [GetPlayer.MakeScope.GetVariable('mwp_assessed_score_5').GetValue|5]. Множитель1 означает отсутствие снижения за избыточность.\n\nМножитель обеспеченности местности: [GetPlayer.MakeScope.GetVariable('mwp_assessed_metric_coverage_5').GetValue|2]. При достаточной силе на данной местности дальнейшая специализация менее приоритетна; польза новых контрполков учитывается отдельно. Преследование также учитывает уже имеющуюся силу."
