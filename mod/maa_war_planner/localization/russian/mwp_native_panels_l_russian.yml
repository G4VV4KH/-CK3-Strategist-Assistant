 mwp_tooltip_rank_neutral: "#warning Средняя треть приоритетов#!"
 mwp_tooltip_create: "создать новый полк"
 mwp_tooltip_unstationed: "не размещён"
 mwp_tooltip_model_note: "Приоритет оценивает пользу следующего уровня с учётом полной уже оплаченной вместимости личных полков. Текущие солдаты отдельно определяют готовность к бою и преодолению гарнизона. Польза боевых и осадных покупок постепенно уменьшается. Лучший осадный тип представляет свою роль; слабые осадные варианты и боевые типы без преимущества по специализации идут после всех самостоятельных ролей, сохраняя положительные оценки. Внутри каждой группы порядок определяется исходной пользой. Лимит и нехватка денег не ухудшают оценку: автонайм выбирает первый доступный приоритет."
 mwp_assessed_action_available: "Действие найма доступно; золото и бюджет проверяются отдельно."
 mwp_assessed_action_unavailable: "Действие найма сейчас недоступно. Оценка пригодности рассчитана."

 mwp_d14_siege_role_note: "Если в анализе есть укрепления противников, а оплаченного личного осадного полка с положительной скоростью осады нет, лучший по ситуации осадный тип получает первый приоритет. Уже первый оплаченный уровень закрывает эту роль, даже до пополнения; следующие уровни оцениваются по обычной убывающей пользе. Цена и лимиты содержания сохраняются."
 mwp_budget_quarter_label: "25% дохода"
 mwp_budget_quarter_tooltip: "#T 25% месячного дохода#!\nСодержание полной вместимости профессионалов должно укладываться в 25% оценённого месячного дохода соответствующего ресурса. Проверка остатка также учитывает прочие текущие расходы.\n\n$mwp_budget_tooltip$"
 mwp_budget_half_label: "50% дохода"
 mwp_budget_half_tooltip: "#T 50% месячного дохода#!\nСодержание полной вместимости профессионалов должно укладываться в 50% оценённого месячного дохода соответствующего ресурса. Проверка остатка также учитывает прочие текущие расходы.\n\n$mwp_budget_tooltip$"
 mwp_d15_raised_maa_label: "Профессионалы: полный состав, подняты"
 mwp_d15_raised_army_label: "Собранное войско: золото"
 mwp_d15_raised_maa_value_text: "@gold_icon! [GetPlayer.MakeScope.GetVariable('mwp_native_cost_maa').GetValueWithDefault('(CFixedPoint)0')|2]"
 mwp_d15_raised_army_value_text: "@gold_icon! [GetPlayer.MakeScope.GetVariable('mwp_native_cost_army').GetValueWithDefault('(CFixedPoint)0')|2]"
 mwp_d15_metrics_pending: "—"
 mwp_d15_metrics_pending_tooltip: "Ожидается актуальная проверенная оценка содержания. При наличии специальных, наёмных или неизвестных типов полков прогноз всей армии недоступен; лимит «Вся армия» приостанавливает найм."
 mwp_d15_raised_maa_tooltip: "#T Месячное содержание полных профессиональных полков#!\nТа же оценка полной вместимости, которую использует автонайм, с известными из скриптов общими армейскими скидками. ≈ сохраняется там, где расчёт консервативен. Найм и перевозка морем считаются отдельно."
 mwp_d15_raised_army_tooltip: "#T Содержание собранного войска в золоте#!\nОценка месячных затрат золота на полную вместимость профессионалов и максимальное ополчение. Прогноз доступен только при феодальном и клановом правлении; прочерк при других формах правления означает, что этот прогноз золота не поддерживается. Престиж, благочестие, казна и бартер здесь не учитываются. Автонайм проверяет фактические ресурсы содержания отдельно."

 mwp_d16_analysis_incomplete: "Оценка не опубликована: у полка противника неподдерживаемый тип или непригодные данные. Снимок неполон, расчёт уже завершён. Кнопка обновления заново собирает данные."
 mwp_d16_geometry_note: "#warning Приближённый расчёт противодействия:#! у некоторых известных полков есть солдаты, но нет корректных данных об уровнях или максимальной численности. Их текущая численность и базовые боевые характеристики учтены; количество отрядов для противодействия рассчитано по базовому размеру типа. Рекомендации используют это приближение."
 mwp_d16_no_note: ""
