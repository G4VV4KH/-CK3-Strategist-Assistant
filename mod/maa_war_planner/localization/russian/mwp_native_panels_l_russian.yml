l_russian:
 mwp_rank_better_tooltip: "#P Лучше подходит#! против учтённых соперников.\n\n$mwp_score_basis_tooltip$"
 mwp_rank_worse_tooltip: "#N Хуже подходит#! против учтённых соперников.\n\n$mwp_score_basis_tooltip$"
 mwp_rank_neutral_tooltip: "#warning Сопоставимая польза#! против учтённых соперников. Это результат расчёта.\n\n$mwp_score_basis_tooltip$"
 mwp_rank_unknown_tooltip: "Оценка ещё не готова либо для этого типа нет доступных вашему персонажу или уже имеющихся полков с поддерживаемыми характеристиками.\n\n[GetPlayer.Custom('mwp_d16_analysis_note')]"
 mwp_score_basis_tooltip: "Соперники сведены в шесть групп силы с весами16/4/1 по актуальности войн. Свои полки используют штатные характеристики владельца и размещения, противники — нынешних солдат и базовые характеристики. Наёмные и событийные полки учитываются по текущей численности. Местность и форты собираются со всех различных проходимых провинций соответствующих вражеских держав; гарнизоны проверяются максимум на восьми представителях. Это модель географии и сил, а не прогноз точных боёв, целей войн или сезонной погоды.\n\n$mwp_d14_siege_role_note$\n\n[GetPlayer.Custom('mwp_d16_analysis_note')]"
 mwp_analysis_status: "Учтено возможных противников: [GetPlayer.MakeScope.GetVariable('mwp_war_scoring_rival_count').GetValue|0]"
 mwp_analysis_status_pending: "[SelectLocalization(And(GetPlayer.MakeScope.GetVariable('mwp_live_collecting').IsSet,EqualTo_CFixedPoint(GetPlayer.MakeScope.GetVariable('mwp_scoring_generation').GetValueWithDefault('(CFixedPoint)-1'),GetPlayer.MakeScope.GetVariable('mwp_generation').GetValueWithDefault('(CFixedPoint)-2'))),'mwp_analysis_progress','mwp_analysis_preparing')]"
 mwp_analysis_progress: "Обработано противников: [GetPlayer.MakeScope.GetVariable('mwp_scoring_accounted_rivals').GetValueWithDefault('(CFixedPoint)0')|0] / [GetPlayer.MakeScope.GetVariable('mwp_war_scoring_rival_count').GetValueWithDefault('(CFixedPoint)0')|0]"
 mwp_analysis_preparing: "Подготовка анализа либо нет актуальных данных"
 mwp_type_estimate_label: "Оценка типа войск"
 mwp_type_estimate_tooltip: "Полезность дополнительного уровня среди доступных вашему персонажу типов и уже имеющихся полков. Полный лимит не скрывает оценку. Цифра — место в списке; цвет — треть списка. Автонайм отдельно проверяет возможность покупки и бюджет."
 mwp_auto_recruit_label: "Нанимать и расширять автоматически"
 mwp_auto_recruit_tooltip: "Автоматически нанимает и расширяет полезные доступные полки. Оплачивает ресурсом, который требуется для выбранного способа найма, и учитывает поддерживаемые скидки. Покупка и месячное содержание могут использовать разные ресурсы."
 mwp_budget_label: "Лимит месячного содержания"
 mwp_budget_tooltip: "Каждый ресурс содержания проверяется отдельно; при добавлении расходов месячный остаток должен сохраняться не ниже +0,01. Используется осторожный прогноз полной вместимости; неполные данные о доходе могут уменьшить доступный бюджет. Покупка, не прошедшая проверку, отменяется с точным возвратом цены. ≈ обозначает оценку."
 mwp_budget_army_label: "Вся армия"
 mwp_budget_army_tooltip: "#T Вся армия#!\nУчитываются содержание полного поднятого войска и прочие текущие расходы. Прогноз военных расходов не может быть ниже уже наблюдаемых текущих военных расходов.\n\n$mwp_budget_tooltip$"
 mwp_budget_maa_label: "100% дохода"
 mwp_budget_maa_tooltip: "#T 100% месячного дохода#!\nСодержание полной вместимости профессионалов должно укладываться в 100% оценённого месячного дохода соответствующего ресурса. Проверка остатка также учитывает прочие текущие расходы.\n\n$mwp_budget_tooltip$"
 mwp_budget_unlimited_label: "Без лимита"
 mwp_budget_unlimited_tooltip: "#T Без лимита месячного содержания#!\nАвтонайм не ограничивается месячным содержанием. Каждая покупка требует соответствующего ресурса; условия найма и лимиты полков сохраняются. Будущие расходы могут превысить доход."
 mwp_refresh_label: "Пересчитать"
 mwp_refresh_tooltip: "Запросить новый анализ. Прежние рекомендации будут недоступны до завершения нового расчёта."
 mwp_rank_details_1: "[SelectLocalization(GetPlayer.MakeScope.GetVariable('mwp_assessed_1').IsSet,'mwp_assessed_details_1','mwp_rank_unknown_tooltip')]"
 mwp_assessed_details_1: "#T [GetMenAtArmsType('huscarl').GetName]#!\n[SelectLocalization(EqualTo_CFixedPoint(GetPlayer.MakeScope.GetVariable('mwp_rank_1').GetValue,'(CFixedPoint)1'),'mwp_tooltip_rank_better',Select_CString(EqualTo_CFixedPoint(GetPlayer.MakeScope.GetVariable('mwp_rank_1').GetValue,'(CFixedPoint)-1'),'mwp_tooltip_rank_worse','mwp_tooltip_rank_neutral'))]\n\nОцениваемый дополнительный уровень: [SelectLocalization(EqualTo_CFixedPoint(GetPlayer.MakeScope.GetVariable('mwp_assessed_metric_action_1').GetValue,'(CFixedPoint)2'),'mwp_tooltip_expand_1','mwp_tooltip_create')]\n[SelectLocalization(GetPlayer.MakeScope.GetVariable('mwp_eligible_1').IsSet,'mwp_assessed_action_available','mwp_assessed_action_unavailable')]\nОценка: #high [GetPlayer.MakeScope.GetVariable('mwp_assessed_score_1').GetValue|3]#! · Среднее: [GetPlayer.MakeScope.GetVariable('mwp_scoring_assessed_mean').GetValue|3]\nПротивников в группах: [GetPlayer.MakeScope.GetVariable('mwp_assessed_metric_targets_1').GetValue|0]\nПрирост пользы: бой [GetPlayer.MakeScope.GetVariable('mwp_assessed_metric_field_1').GetValue|1] · преследование [GetPlayer.MakeScope.GetVariable('mwp_assessed_metric_pursuit_1').GetValue|1] · прикрытие [GetPlayer.MakeScope.GetVariable('mwp_assessed_metric_screen_1').GetValue|1]\nПольза для осад: [GetPlayer.MakeScope.GetVariable('mwp_assessed_metric_siege_1').GetValue|1]\nСнижение урона врага дополнительным противодействием: [GetPlayer.MakeScope.GetVariable('mwp_assessed_metric_counter_1').GetValue|1]%\nХудшее соотношение сил среди профилей: [GetPlayer.MakeScope.GetVariable('mwp_assessed_metric_before_1').GetValue|2] → [GetPlayer.MakeScope.GetVariable('mwp_assessed_metric_after_1').GetValue|2]\nПоправка характеристик на местность: [GetPlayer.MakeScope.GetVariable('mwp_assessed_metric_terrain_1').GetValue|1]%\nМодельная стоимость найма и 24 месяцев содержания: [GetPlayer.MakeScope.GetVariable('mwp_assessed_metric_cost_1').GetValue|1] условных единиц\n\n\nТекущая готовность к бою: [GetPlayer.MakeScope.GetVariable('mwp_siege_access').GetValue|2] · осада после пополнения: [GetPlayer.MakeScope.GetVariable('mwp_siege_average_days').GetValue|0] модельных дней. Осадная полезность180/(180+дни) насыщается по мере роста оплаченной осадной вместимости.\n\n$mwp_tooltip_model_note$\n$mwp_score_basis_tooltip$\n\nДо учёта избыточности роли: [GetPlayer.MakeScope.GetVariable('mwp_raw_assessed_score_1').GetValue|5] · множитель: [GetPlayer.MakeScope.GetVariable('mwp_redundancy_factor_1').GetValue|5] · итог: [GetPlayer.MakeScope.GetVariable('mwp_assessed_score_1').GetValue|5]. Множитель1 означает отсутствие снижения за избыточность.\n\nМножитель обеспеченности местности: [GetPlayer.MakeScope.GetVariable('mwp_assessed_metric_coverage_1').GetValue|2]. При достаточной силе на данной местности дальнейшая специализация менее приоритетна; польза новых контрполков учитывается отдельно. Преследование также учитывает уже имеющуюся силу."
 mwp_tooltip_expand_1: "расширить [GetPlayer.MakeScope.GetVariable('mwp_assessed_regiment_1').Regiment.GetName] ([SelectLocalization(GetPlayer.MakeScope.GetVariable('mwp_assessed_metric_origin_1').IsSet,'mwp_tooltip_origin_1','mwp_tooltip_unstationed')])"
 mwp_tooltip_origin_1: "[GetPlayer.MakeScope.GetVariable('mwp_assessed_metric_origin_1').Province.GetName]"
