 mwp_cost_cache_army_approx_text: "≈ @gold_icon! [GetPlayer.MakeScope.GetVariable('mwp_script_raised_army_upkeep').GetValueWithDefault('(CFixedPoint)0')|2]"
 mwp_cost_cache_approx_tooltip: "Актуальная оценка, используемая лимитом содержания. Учитывает известные из скриптов армейские скидки; неподдержанные источники скидок и скидки только на ополчение остаются консервативными. Локализованные числа не разбираются."

 mwp_d18_own_analysis_incomplete: "Оценка недоступна: не удалось полностью прочитать собственную армию или параметры доступных полков. Расчёт завершён без публикации."
 mwp_d18_analysis_expired: "Оценка недоступна: снимок противников устарел до окончания повторного расчёта. Автоматический повтор остановлен."
