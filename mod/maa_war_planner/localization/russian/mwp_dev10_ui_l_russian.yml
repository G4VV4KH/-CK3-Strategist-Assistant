l_russian:
 mwp_dev10_troops: "Войска"
 mwp_dev10_wars: "Войны"
 mwp_dev10_reorganization_label: "Разрешить реорганизацию полков"
 mwp_dev10_reorganization_tooltip: "Увольнять только обычный неподнятый личный полк с красной оценкой, если все места заняты и нельзя расширить жёлтый или зелёный полк. Перед увольнением проверяется доступность первого уровня лучшей зелёной замены. Без возврата золота и переноса уровней: обычный автонайм создаёт новый полк с одного уровня и расширяет его по бюджету.\n\nПока укрепления противников актуальны, реорганизация сохраняет последний полезный оплаченный личный осадный полк, кроме замены на другой полезный осадный тип. Сохраняются все обычные требования: красная оценка, доступность и бюджет."
 mwp_dev10_priority_tooltip: "Приоритет полезности среди оценённых типов. 1 — самый полезный. Доступность найма, ресурсы покупки и месячные лимиты проверяются отдельно."
 mwp_dev10_likelihood_label: "Вероятность"
 mwp_dev10_likelihood_high: "Высокая"
 mwp_dev10_likelihood_medium: "Средняя"
 mwp_dev10_likelihood_low: "Низкая"
 mwp_dev10_likelihood_tooltip: "Относительная оценка сценария, а не измеренная вероятность. Текущие войны показаны отдельно."
 mwp_dev10_next_purchase: "Следующая покупка: [MenAtArmsType.GetName] · приоритет [GetPlayer.MakeScope.GetVariable(Concatenate('mwp_priority_',IntToString(FixedPointToInt(GetPlayer.MakeScope.GetVariable('mwp_next_catalog_id').GetValue)))).GetValue|0]"
 mwp_dev10_no_purchase: "Нет доступной покупки"
 mwp_dev10_row_strength: "Армия: [Character.GetCurrentMilitaryStrength|0]"
 mwp_dev10_row_fort: "Крепость столицы: [Character.GetCapitalLocation.GetFortLevel|0]"
