l_russian:
 mwp20_war_open_tooltip: "#T Открыть войну#!\nПоказать стороны, счёт войны и условия мира."
 mwp20_war_score: "Счёт нападающего: [War.GetWarScore|0]%"
 mwp20_white_peace_tooltip: "#T Статус-кво без заложников#!\nДоступно руководителю стороны, если игра разрешает отправить эти условия мира. Открывается штатное окно подтверждения; нажатие не завершает войну. Чтобы выбрать заложников, откройте саму войну."
 mwp20_enforce_tooltip: "#T Навязать требования#!\nОткрыть штатные условия победы. Кнопка доступна руководителю стороны, когда игра разрешает навязать победу. Отправка и окончательная проверка выполняются в открывшемся окне; само нажатие не завершает войну."
