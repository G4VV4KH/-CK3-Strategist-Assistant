 mwp_info_decision_desc:0 "攻撃・防衛の潜在的な対戦相手、現在の戦争、推奨される常備軍兵科を確認します。"
 mwp_info_coverage:0 "潜在的な対戦相手であり、確定した宣戦候補ではありません。対象の条件や同盟者の参戦は予測しません。"
 mwp_info_future_tooltip:0 "各行は潜在的な対戦相手を示すもので、開戦事由・請求者・対象称号の全組み合わせではありません。利用可能という表示にはゲームの宣戦対話の判定を使います。最終的に選ぶ対象、費用、送信オプションは検証しません。派閥、将来のスクリプト侵略、同盟者の参戦予測は含みません。"
 mwp_info_offensive_heading:0 "表示：[GetDataModelSize(GetPlayer.MakeScope.GetList(Select_CString(GetVariableSystem.Exists('mwp_info_show_candidates'),'mwp_info_offensive_sorted','mwp_info_offensive_valid_sorted')))] · 強い順"
 mwp_info_defensive_heading:0 "表示：[GetDataModelSize(GetPlayer.MakeScope.GetList(Select_CString(GetVariableSystem.Exists('mwp_info_show_candidates'),'mwp_info_defensive_sorted','mwp_info_defensive_valid_sorted')))] · 強い順"
