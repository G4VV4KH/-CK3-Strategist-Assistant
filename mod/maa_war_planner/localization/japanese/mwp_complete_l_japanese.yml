 mwp_info_capital_fort:0 "首都の要塞レベル：[Character.GetCapitalLocation.GetFortLevel|0]"
 mwp_info_no_capital:0 "—"
 mwp_info_active_cb:0 "事由：[War.GetActiveCB.GetType.GetName]"
 mwp_info_fort_summary:0 "敵の領国：要塞 [GetPlayer.MakeScope.GetVariable('mwp_war_fort_sample_count').GetValueWithDefault('(CFixedPoint)0')|0] · 最高レベル [GetPlayer.MakeScope.GetVariable('mwp_war_fort_peak').GetValueWithDefault('(CFixedPoint)0')|0]"
 mwp_info_forts_tooltip:0 "関連する敵領国の通行可能な全プロヴィンスを地形評価に使い（[GetPlayer.MakeScope.GetVariable('mwp_war_terrain_sample_count').GetValueWithDefault('(CFixedPoint)0')|0]州）、全要塞を攻城要件に使います。首都（[GetPlayer.MakeScope.GetVariable('mwp_war_region_capital_count').GetValueWithDefault('(CFixedPoint)0')|0]）と国境のプロヴィンス（[GetPlayer.MakeScope.GetVariable('mwp_war_region_border_count').GetValueWithDefault('(CFixedPoint)0')|0]）はその部分集合として扱い、領国が重複しても一度だけ数えます。戦争の重要度による重みは16/4/1です。守備隊の詳細には最大8か所の代表値を使います。各行は統治者の現在の首都要塞のみを示します。地理情報は計画用の推定であり、正確な戦争目標や季節ごとの天候を予測するものではありません。"
