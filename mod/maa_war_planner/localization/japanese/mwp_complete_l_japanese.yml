 mwp20_white_peace_tooltip:0 "#T 人質なしの白紙和平#!\nゲームがこの和平条件の送信を許可している場合、陣営の指導者が利用できます。通常の確認画面を開くだけで、クリックしても戦争は終わりません。人質を選ぶには戦争そのものを開いてください。"
 mwp20_enforce_tooltip:0 "#T 要求を強制#!\n通常の勝利条件を開きます。ゲームが勝利の強制を許可している場合、陣営の指導者が利用できます。開いた画面で最終確認と条件の送信を行います。このボタンのクリックだけでは戦争は終わりません。"
 mwp_info_open_label:0 "情報：戦争計画"
