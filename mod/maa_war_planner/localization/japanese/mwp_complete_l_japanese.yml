 mwp_d20_defensive_rank:0 "順位 [Character.MakeScope.GetVariable('mwp_war_defensive_rank').GetValueWithDefault('(CFixedPoint)0')|0] · 点数 [Character.MakeScope.GetVariable('mwp_war_defensive_priority_score').GetValueWithDefault('(CFixedPoint)0')|1]"
 mwp_d20_cb_unknown:0 "具体的な開戦事由は取得できません"
 mwp_d20_cb_tooltip:0 "ゲームが有効と判定した、検出済みで最も価値の高い開戦事由の種類です。種類同士の比較であり、具体的な対象、費用、条件は通常の宣戦画面で確認します。防衛では敵があなたに使える開戦事由を表示します。"
 mwp_d20_cb_details:0 "開戦条件"
 mwp_d20_cb_details_tooltip:0 "通常の宣戦画面を開き、対象、費用、条件を確認します。宣戦布告はしません。"
