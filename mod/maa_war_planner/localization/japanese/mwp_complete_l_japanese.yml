 mwp_d20_claim_invite_tooltip:0 "最終確認のため通常の招待画面を開きます。このボタンを有効にする前に、受諾、請求権、防衛側を再確認します。任意の支払いやフックの使用は自分で決められます。"
 mwp_d20_claim_stale:0 "条件が変化しました：更新してください"
