 mwp_dev10_reorganization_label:0 "連隊の再編を許可"
 mwp_dev10_reorganization_tooltip:0 "全枠が埋まり、黄・緑評価の連隊を増強できない場合に限り、未招集の通常の個人連隊のうち赤評価のものを解雇します。先に、より優れた緑評価の代替連隊を購入できるか確認します。返金やレベル移転はありません。その後、通常の自動雇用で新しい連隊を1レベルから作り、予算内で増強します。\n\n敵の要塞が依然として重要な間は、有用な有料個人攻城連隊の最後の1隊を維持します。ただし、有用な別の攻城兵科を有料で代わりに雇える場合は除きます。赤評価限定、雇用条件、予算に関する通常の規則も適用されます。"
 mwp_dev10_priority_tooltip:0 "評価済み兵種の有用性の優先順位です。1が最も有用です。雇用の可否、購入資源、月間上限は別々に確認します。"
