 mwp_tooltip_rank_better:0 "#P 優先順位の上位3分の1#!"
 mwp_tooltip_rank_worse:0 "#N 優先順位の下位3分の1#!"
 mwp_tooltip_rank_neutral:0 "#warning 優先順位の中位3分の1#!"
 mwp_tooltip_create:0 "新しい連隊を作成"
 mwp_tooltip_unstationed:0 "未配置"
 mwp_tooltip_model_note:0 "優先順位は、購入済みの個人連隊がすべて補充された後で、次の1レベルが持つ有用性を推定します。現在の兵数は、戦闘への対応度と守備隊への警戒を別途決定します。野戦・攻城の利益は追加ごとに低下します。状況に最適な攻城兵科がその役割を代表し、より弱い攻城兵科やモデル上の専門性がない戦闘兵科は、異なる役割を持つ全兵科の後に置きますが、点数は正です。各グループ内は元の有用性で並べます。定員や購入可否で評価は下がりません。自動化は実行可能な最上位の候補を購入します。"
 mwp_assessed_action_available:0 "雇用操作は利用可能です。金と予算は別途確認します。"
 mwp_assessed_action_unavailable:0 "現在、雇用操作は利用できません。適性の評価結果は維持します。"
 mwp_d14_siege_role_note:0 "調査した敵要塞に攻城兵器が必要で、ゲーム上の攻城速度が正の有料個人攻城連隊がない場合、状況に最適な攻城兵科を最優先にします。最初の有料1レベルで、補充前でもこの役割を満たします。追加レベルには通常の効用逓減を適用します。費用と維持費の上限も適用されます。"
 mwp_budget_quarter_label:0 "収入の25%"
 mwp_budget_quarter_tooltip:0 "#T 月収の25%#!\n最大兵力の常備軍の維持費を、該当資源の推定月収の25%以内に収めます。収支の確認では、その他の現在の支出も考慮します。\n\n$mwp_budget_tooltip$"
 mwp_budget_half_label:0 "収入の50%"
 mwp_budget_half_tooltip:0 "#T 月収の50%#!\n最大兵力の常備軍の維持費を、該当資源の推定月収の50%以内に収めます。収支の確認では、その他の現在の支出も考慮します。\n\n$mwp_budget_tooltip$"
 mwp_d15_raised_maa_label:0 "定員まで補充し招集した常備軍"
 mwp_d15_raised_army_label:0 "招集軍：金の維持費"
 mwp_d15_raised_maa_value_text:0 "@gold_icon! [GetPlayer.MakeScope.GetVariable('mwp_native_cost_maa').GetValueWithDefault('(CFixedPoint)0')|2]"
 mwp_d15_raised_army_value_text:0 "@gold_icon! [GetPlayer.MakeScope.GetVariable('mwp_native_cost_army').GetValueWithDefault('(CFixedPoint)0')|2]"
 mwp_d15_metrics_pending:0 "—"
 mwp_d15_metrics_pending_tooltip:0 "現在の検証済み維持費推定を待機中です。特殊、雇われた、または不明な兵科の連隊があると全軍の予測はできず、「全軍」の上限では雇用を一時停止します。"
 mwp_d15_raised_maa_tooltip:0 "#T 常備軍全体の月間維持費#!\n自動雇用と同じ定員時の推定で、スクリプトから把握できる全軍維持費の割引を含みます。元データからの復元が安全側の概算になる箇所には≈を残します。雇用費と乗船費は別です。"
 mwp_d15_raised_army_tooltip:0 "#T 招集軍の金の維持費#!\n定員に達した常備軍と最大数の徴募兵に毎月かかる金の概算です。この予測は封建制と氏族制でのみ利用できます。その他の政体の「—」は、この金の予測に対応していないことを示します。威信、敬虔点、国庫、物々交換品で支払う維持費は含まれません。自動募集は、実際に維持費の支払いに使う資源を別途確認します。"
 mwp_d16_analysis_incomplete:0 "評価結果を公開できませんでした。敵部隊に未対応の兵科または利用できないデータがあります。計算中ではなく、取得データが不完全な状態です。更新するとデータを再取得します。"
 mwp_d16_geometry_note:0 "#warning 敵の対抗兵力は概算：#!一部の既知部隊は兵数を取得できても、有効なレベル・定員構成を取得できません。現在の兵数と基本戦闘能力は含め、対抗兵力には兵科の基本編制人数を使います。そのため雇用判断には概算を用います。"
 mwp_d16_no_note:0 ""
 mwp_cost_cache_maa_approx_text:0 "≈ @gold_icon! [GetPlayer.MakeScope.GetVariable('mwp_script_maa_upkeep').GetValueWithDefault('(CFixedPoint)0')|2]"
 mwp_cost_cache_army_approx_text:0 "≈ @gold_icon! [GetPlayer.MakeScope.GetVariable('mwp_script_raised_army_upkeep').GetValueWithDefault('(CFixedPoint)0')|2]"
 mwp_cost_cache_approx_tooltip:0 "維持費上限に使う現在の推定です。元データから分かる軍維持費の割引を適用します。未対応の減額要因や徴募兵だけの割引は安全側に扱います。翻訳された数値を解析することはありません。"
 mwp_d18_own_analysis_incomplete:0 "評価できません：自軍データまたは利用可能な連隊のパラメータを完全に取得できませんでした。計算は終了しましたが、結果は公開していません。"
 mwp_d18_analysis_expired:0 "評価できません：再計算が終わる前に敵の取得データが失効しました。自動再試行は停止しました。"
