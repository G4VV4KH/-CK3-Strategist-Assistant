 mwp_rank_better_tooltip:0 "分析した相手に対して#P より適しています#!。\n\n$mwp_score_basis_tooltip$"
 mwp_rank_worse_tooltip:0 "分析した相手に対して#N あまり適していません#!。\n\n$mwp_score_basis_tooltip$"
 mwp_rank_neutral_tooltip:0 "分析した相手に対して#warning 同程度の有用性#!があります。これは計算済みの結果です。\n\n$mwp_score_basis_tooltip$"
 mwp_rank_unknown_tooltip:0 "評価待ち、またはこの兵科に利用可能な雇用手段も、対応した統計を持つ既存連隊もありません。\n\n[GetPlayer.Custom('mwp_d16_analysis_note')]"
 mwp_score_basis_tooltip:0 "相手を6段階の兵力帯にまとめ、現在・高・中・低の重要度に応じて16/4/1の重みを付けます。自軍連隊は所有者と配置先の実際の能力値、敵軍は現在の兵数と基本能力値を使います。雇われた部隊とイベント部隊も現在の兵力を維持します。関連する敵領国の通行可能な全プロヴィンスの地形と要塞に重みを付け、守備隊は最大8か所の代表値を使います。地理と兵力に基づく概算であり、正確な戦闘、戦争目標、季節ごとの天候を予測するものではありません。\n\n$mwp_d14_siege_role_note$\n\n[GetPlayer.Custom('mwp_d16_analysis_note')]"
 mwp_analysis_status:0 "分析済みの潜在的対戦相手：[GetPlayer.MakeScope.GetVariable('mwp_war_scoring_rival_count').GetValue|0]"
 mwp_analysis_status_pending:0 "[SelectLocalization(And(GetPlayer.MakeScope.GetVariable('mwp_live_collecting').IsSet,EqualTo_CFixedPoint(GetPlayer.MakeScope.GetVariable('mwp_scoring_generation').GetValueWithDefault('(CFixedPoint)-1'),GetPlayer.MakeScope.GetVariable('mwp_generation').GetValueWithDefault('(CFixedPoint)-2'))),'mwp_analysis_progress','mwp_analysis_preparing')]"
 mwp_analysis_progress:0 "処理済みの対戦相手：[GetPlayer.MakeScope.GetVariable('mwp_scoring_accounted_rivals').GetValueWithDefault('(CFixedPoint)0')|0] / [GetPlayer.MakeScope.GetVariable('mwp_war_scoring_rival_count').GetValueWithDefault('(CFixedPoint)0')|0]"
 mwp_analysis_preparing:0 "分析を準備中、または現在の結果を利用できません"
 mwp_type_estimate_label:0 "兵科の適性推定"
 mwp_type_estimate_tooltip:0 "キャラクターが利用できる兵科と既存連隊について、追加1レベルの有用性を評価します。定員に達していても評価は表示します。数字は順位、色は上・中・下位の3区分を示します。自動化では利用可否と予算を別途確認します。"
 mwp_auto_recruit_label:0 "自動で雇用・増強"
 mwp_auto_recruit_tooltip:0 "有用で費用を支払える連隊を自動で雇用・拡張します。雇用方法に応じた資源を支払い、対応済みの割引を適用します。購入費と月間維持費では異なる資源を使う場合があります。"
 mwp_budget_label:0 "月間維持費の上限"
 mwp_budget_tooltip:0 "維持費に必要な資源を個別に確認し、支出追加後も月間収支を最低+0.01に保ちます。最大兵力での維持費を慎重に見積もるため、収入の詳細が取得できない場合は予算が減ることがあります。確認に失敗した購入は取り消し、支払額を正確に返金します。≈は推定値です。"
 mwp_budget_army_label:0 "全軍"
 mwp_budget_army_tooltip:0 "#T 全軍#!\n定員まで補充して招集した全軍と、現在のほかの支出を含みます。予測する軍事支出は、現在確認できる軍事支出を下回りません。\n\n$mwp_budget_tooltip$"
 mwp_budget_maa_label:0 "収入の100%"
 mwp_budget_maa_tooltip:0 "#T 月収の100%#!\n最大兵力の常備軍の維持費を、該当資源の推定月収の100%以内に収めます。収支の確認では、その他の現在の支出も考慮します。\n\n$mwp_budget_tooltip$"
 mwp_budget_unlimited_label:0 "上限なし"
 mwp_budget_unlimited_tooltip:0 "#T 月間維持費の上限なし#!\n自動雇用では月間維持費の上限を適用しません。各購入には実際に必要な資源が必要で、雇用条件と連隊上限も適用されます。将来の支出が収入を超えることがあります。"
 mwp_refresh_label:0 "軍を再評価"
